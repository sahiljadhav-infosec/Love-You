<!DOCTYPE html>
<html>
<head>
<title>Shiu ❤️ Sahil – 9th Valentine</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  text-align: center;
  margin: 0;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at 20% 30%, #5a002d, #2b0018 60%);
  transition: transform 0.6s ease;
  position: relative;
  color: white;
}

/* Moving romantic light */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,0,120,0.15) 0%, transparent 60%);
  animation: moveLight 18s linear infinite;
  z-index: 0;
}

@keyframes moveLight {
  0% { transform: translate(-20%, -20%); }
  50% { transform: translate(20%, 20%); }
  100% { transform: translate(-20%, -20%); }
}

/* Dark vignette */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.75) 100%);
  z-index: 1;
  pointer-events: none;
}

body.zoom { transform: scale(1.05); }

body.shake { animation: shake 0.4s; }

@keyframes shake {
  0% { transform: translate(2px,2px); }
  25% { transform: translate(-2px,-2px); }
  50% { transform: translate(2px,-2px); }
  75% { transform: translate(-2px,2px); }
  100% { transform: translate(0,0); }
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 2;
}

.glow-name {
  position: fixed;
  top: 40%;
  width: 100%;
  font-size: 110px;
  font-family: 'Playfair Display', serif;
  color: rgba(255, 255, 255, 0.04);
  animation: pulse 4s ease-in-out infinite;
  z-index: 2;
}

@keyframes pulse {
  0%,100% { text-shadow: 0 0 40px #ff4da6; }
  50% { text-shadow: 0 0 100px #ff66b2; }
}

.container {
  margin-top: 90px;
  position: relative;
  z-index: 3;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 40px;
  color: #ff80bf;
}

h2 {
  font-weight: 300;
  color: #ffcce6;
}

button {
  padding: 12px 30px;
  font-size: 18px;
  margin: 15px;
  cursor: pointer;
  border-radius: 30px;
  border: none;
  transition: 0.3s;
}

#yesBtn {
  background: linear-gradient(45deg, #ff3366, #ff66b2);
  color: white;
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background: #888;
  color: white;
  position: relative;
}

#message {
  font-family: 'Great Vibes', cursive;
  font-size: 70px;
  margin-top: 50px;
  display: none;
  color: #ff99cc;
  animation: explode 1.3s ease-out forwards;
}

@keyframes explode {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.4); opacity: 1; }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="glow-name">SHIU</div>
<canvas id="fireworks"></canvas>

<div class="container">
<h1>Happy 9th Valentine Shiu 🌹</h1>

<h2 id="dayCounter"></h2>

<h2>Will you always be my forever Valentine? 💘</h2>

<button id="yesBtn" onclick="yesClicked()">Always Yes 😌</button>
<button id="noBtn" onclick="handleNo()">No 😏</button>

<div id="message">I Love You Shiu ❤️</div>
</div>

<script>
// Day Counter
const startDate = new Date("January 16, 2018");
const today = new Date();
const diffDays = Math.floor((today - startDate) / (1000*60*60*24));
document.getElementById("dayCounter").innerHTML =
  "We have been together for " + diffDays + " Beautiful Days 💖";

// No Button Behavior
let noClickCount = 0;
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

function handleNo() {
  noClickCount++;

  const texts = [
    "Are you sure?",
    "Think again Shiu 😌",
    "Really??",
    "Wrong choice 😏",
    "Nice try ❤️"
  ];

  noBtn.innerText = texts[noClickCount % texts.length];

  noBtn.style.transform = `scale(${1 - noClickCount*0.1})`;

  if (noClickCount % 2 === 0) {
    let temp = yesBtn.innerHTML;
    yesBtn.innerHTML = noBtn.innerHTML;
    noBtn.innerHTML = temp;
  }
}

// Yes Clicked
function yesClicked() {
  document.body.classList.add("zoom");
  setTimeout(() => document.body.classList.add("shake"), 300);
  setTimeout(() => {
    document.getElementById("message").style.display = "block";
    startFireworks();
  }, 700);
}

// Fireworks
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];

function startFireworks() {
  setInterval(() => {
    let x = Math.random() * canvas.width;
    let y = Math.random() * canvas.height / 2;

    for (let i = 0; i < 100; i++) {
      particles.push({
        x: x,
        y: y,
        angle: Math.random() * 2 * Math.PI,
        speed: Math.random() * 4 + 2,
        radius: 2,
        color: `hsl(${Math.random()*360},100%,60%)`
      });
    }
  }, 700);
}

function animate() {
  requestAnimationFrame(animate);
  ctx.fillStyle = "rgba(43, 0, 24, 0.25)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, index) => {
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    p.radius *= 0.96;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();

    if (p.radius < 0.5) particles.splice(index, 1);
  });
}
animate();
</script>

</body>
</html>
