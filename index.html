<!DOCTYPE html>
<html>
<head>
<title>Shiu ❤️ Sahil – 9th Valentine</title>

<style>
body {
  text-align: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #ffb6c1, #ffe6f0);
  margin: 0;
  overflow: hidden;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}

.glow-name {
  position: fixed;
  top: 40%;
  width: 100%;
  font-size: 80px;
  font-weight: bold;
  color: rgba(255, 0, 100, 0.08);
  text-shadow: 0 0 20px #ff4da6, 0 0 40px #ff66b2;
  z-index: 0;
}

.container {
  margin-top: 80px;
  padding: 20px;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 34px;
  color: #d1005d;
}

h2 {
  color: #99004d;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  margin: 15px;
  cursor: pointer;
  border-radius: 20px;
  border: none;
  transition: 0.3s;
}

#yesBtn {
  background-color: #ff3366;
  color: white;
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background-color: grey;
  color: white;
  position: absolute;
}

#message {
  font-size: 26px;
  margin-top: 30px;
  font-weight: bold;
  color: #cc0052;
  display: none;
  animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="glow-name">SHIU</div>
<canvas id="fireworks"></canvas>

<div class="container">
<h1>🌹 Happy 9th Valentine Shiu 🌹</h1>

<p id="dayCounter" style="font-size:22px; color:#660033;"></p>

<h2>Will you always be my forever Valentine? 💘</h2>

<button id="yesBtn" onclick="yesClicked()">Always Yes 😌</button>
<button id="noBtn" onmouseover="moveButton()">No 😏</button>

<div id="message">I LOVE YOU SHIU ❤️</div>
</div>

<script>
// LIVE DAY COUNTER (hidden start date)
const startDate = new Date("January 16, 2018");
const today = new Date();
const diffTime = today - startDate;
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
document.getElementById("dayCounter").innerHTML =
  "We have been together for " + diffDays + " Beautiful Days 💖";

// RUNNING NO BUTTON
function moveButton() {
  var button = document.getElementById("noBtn");
  var x = Math.random() * (window.innerWidth - 100);
  var y = Math.random() * (window.innerHeight - 100);
  button.style.left = x + "px";
  button.style.top = y + "px";
}

// YES CLICKED
function yesClicked() {
  document.getElementById("message").style.display = "block";
  startFireworks();
}

// FIREWORKS
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function startFireworks() {
  setInterval(() => {
    let x = Math.random() * canvas.width;
    let y = Math.random() * canvas.height / 2;

    for (let i = 0; i < 80; i++) {
      particles.push({
        x: x,
        y: y,
        angle: Math.random() * 2 * Math.PI,
        speed: Math.random() * 4 + 2,
        radius: 2,
        color: `hsl(${Math.random()*360},100%,60%)`
      });
    }
  }, 700);
}

function animate() {
  requestAnimationFrame(animate);
  ctx.fillStyle = "rgba(255, 182, 193, 0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, index) => {
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    p.radius *= 0.96;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();

    if (p.radius < 0.5) {
      particles.splice(index, 1);
    }
  });
}

animate();
</script>

</body>
</html>
