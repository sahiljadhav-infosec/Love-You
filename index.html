<!DOCTYPE html>
<html>
<head>
<title>9th Valentine – Shiu ❤️ Sahil</title>
<style>
body {
  text-align: center;
  font-family: 'Arial';
  background: linear-gradient(to right, #ffb6c1, #ffe6f0);
  overflow: hidden;
  margin: 0;
}

.container {
  margin-top: 60px;
  padding: 20px;
}

h1 {
  font-size: 42px;
  color: #d1005d;
}

h2 {
  color: #99004d;
}

p {
  font-size: 20px;
  color: #660033;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  margin: 15px;
  cursor: pointer;
  border-radius: 20px;
  border: none;
  transition: 0.3s;
}

#yesBtn {
  background-color: #ff3366;
  color: white;
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background-color: grey;
  color: white;
  position: absolute;
}

#message {
  font-size: 22px;
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🌹 Happy 9th Valentine Shiu 🌹</h1>
<p>9 Years. 9 Valentines. Infinite Memories.</p>
<p>From our first smile to forever promises...</p>

<h2>Shiu, will you continue being my forever Valentine? ❤️</h2>

<button id="yesBtn" onclick="yesClicked()">Always Yes 😌💘</button>
<button id="noBtn" onmouseover="moveButton()">No 😏</button>

<p id="message"></p>
</div>

<script>
function moveButton() {
  var button = document.getElementById("noBtn");
  var x = Math.random() * (window.innerWidth - 100);
  var y = Math.random() * (window.innerHeight - 100);
  button.style.left = x + "px";
  button.style.top = y + "px";
}

function yesClicked() {
  document.getElementById("message").innerHTML =
    "Shiu ❤️ These 9 years with you have been the most beautiful chapter of my life. Through fights, laughs, distance, growth – you chose me. And I choose you. Every day. Forever. 💍✨ I love you more than words can explain.";

  startHearts();
}

function startHearts() {
  setInterval(function() {
    var heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.style.position = "absolute";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = "-20px";
    heart.style.fontSize = "24px";
    document.body.appendChild(heart);

    setTimeout(function() {
      heart.style.top = window.innerHeight + "px";
    }, 100);

    setTimeout(function() {
      heart.remove();
    }, 3000);

  }, 300);
}
</script>

</body>
</html>
