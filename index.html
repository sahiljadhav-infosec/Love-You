<!DOCTYPE html>
<html>
<head>
<title>Relationship Test</title>
<style>
body {
  text-align: center;
  font-family: Arial;
  background-color: #ffe6f0;
}

.container {
  margin-top: 100px;
}

button {
  padding: 10px 20px;
  font-size: 18px;
  margin: 10px;
  cursor: pointer;
  border-radius: 10px;
  border: none;
}

#yesBtn {
  background-color: #ff4d88;
  color: white;
}

#noBtn {
  background-color: grey;
  color: white;
  position: absolute;
}
</style>
</head>

<body>

<div class="container">
<h1>Relationship Compatibility Test 💖</h1>
<p>Final Question:</p>
<h2>Do you love me forever? 🥺</h2>

<button id="yesBtn" onclick="yesClicked()">Yes ❤️</button>
<button id="noBtn" onmouseover="moveButton()">No 😏</button>

<p id="message"></p>
</div>

<script>
function moveButton() {
  var button = document.getElementById("noBtn");
  var x = Math.random() * window.innerWidth;
  var y = Math.random() * window.innerHeight;
  button.style.left = x + "px";
  button.style.top = y + "px";
}

function yesClicked() {
  document.getElementById("message").innerHTML =
    "I knew it 😌❤️ I love you more than anything in this world. You are my favorite human forever.";
}
</script>

</body>
</html>
