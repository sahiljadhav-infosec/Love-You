<!DOCTYPE html>
<html>
<head>
<title>9th Valentine – Shiu ❤️ Sahil</title>

<style>
body {
  text-align: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #ffb6c1, #ffe6f0);
  margin: 0;
  overflow: hidden;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}

.container {
  margin-top: 60px;
  padding: 20px;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 36px;
  color: #d1005d;
}

h2 {
  color: #99004d;
}

p {
  font-size: 20px;
  color: #660033;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  margin: 15px;
  cursor: pointer;
  border-radius: 20px;
  border: none;
  transition: 0.3s;
}

#yesBtn {
  background-color: #ff3366;
  color: white;
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background-color: grey;
  color: white;
  position: absolute;
}

#message {
  font-size: 22px;
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_3a82d7e70b.mp3" type="audio/mp3">
</audio>

<div class="container">
<h1>🌹 Happy 9th Valentine Shiu 🌹</h1>

<p>We have been together for</p>
<h2 id="dayCounter"></h2>
<p>since 16 January 2018 ❤️</p>

<h2>Shiu, will you continue being my forever Valentine? 💘</h2>

<button onclick="playMusic()">🎵 Tap to Play Music</button>
<br>

<button id="yesBtn" onclick="yesClicked()">Always Yes 😌</button>
<button id="noBtn" onmouseover="moveButton()">No 😏</button>

<p id="message"></p>
</div>

<script>
// DAY COUNTER
const startDate = new Date("January 16, 2018");
const today = new Date();
const diffTime = today - startDate;
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
document.getElementById("dayCounter").innerHTML = diffDays + " Beautiful Days 💖";

// RUNNING NO BUTTON
function moveButton() {
  var button = document.getElementById("noBtn");
  var x = Math.random() * (window.innerWidth - 100);
  var y = Math.random() * (window.innerHeight - 100);
  button.style.left = x + "px";
  button.style.top = y + "px";
}

// MUSIC
function playMusic() {
  document.getElementById("bgMusic").play();
}

// YES CLICKED
function yesClicked() {
  document.getElementById("message").innerHTML =
    "Shiu ❤️ These " + diffDays + " days with you have been the most beautiful chapter of my life. I choose you. Every day. Forever. 💍✨";

  startFireworks();
}

// FIREWORKS
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function startFireworks() {
  setInterval(() => {
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        angle: Math.random() * 2 * Math.PI,
        speed: Math.random() * 5 + 2,
        radius: 2
      });
    }
  }, 800);
}

function animate() {
  requestAnimationFrame(animate);
  ctx.fillStyle = "rgba(255, 182, 193, 0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, index) => {
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    p.radius *= 0.96;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = "red";
    ctx.fill();

    if (p.radius < 0.5) {
      particles.splice(index, 1);
    }
  });
}

animate();
</script>

</body>
</html>
