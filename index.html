<!DOCTYPE html>
<html>
<head>
<title>Shiu ❤️ Sahil – 9th Valentine</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  text-align: center;
  margin: 0;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(-45deg, #ff3366, #ff4d88, #ff1a75, #ff66b2);
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
  transition: transform 0.6s ease;
  color: white;
  position: relative;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Soft glowing overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%);
  animation: glowMove 10s ease-in-out infinite;
  z-index: 0;
}

@keyframes glowMove {
  0%,100% { transform: translate(0,0); }
  50% { transform: translate(30px, 30px); }
}

body.zoom { transform: scale(1.05); }

body.shake { animation: shake 0.4s; }

@keyframes shake {
  0% { transform: translate(2px,2px); }
  25% { transform: translate(-2px,-2px); }
  50% { transform: translate(2px,-2px); }
  75% { transform: translate(-2px,2px); }
  100% { transform: translate(0,0); }
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 1;
}

.glow-name {
  position: fixed;
  top: 40%;
  width: 100%;
  font-size: 110px;
  font-family: 'Playfair Display', serif;
  color: rgba(255, 255, 255, 0.07);
  animation: pulse 3.5s ease-in-out infinite;
  z-index: 1;
}

@keyframes pulse {
  0%,100% { text-shadow: 0 0 40px white; }
  50% { text-shadow: 0 0 100px #ffe6f2; }
}

.container {
  margin-top: 90px;
  position: relative;
  z-index: 2;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  text-shadow: 0 0 20px rgba(255,255,255,0.6);
}

h2 {
  font-weight: 300;
  color: #ffe6f2;
}

button {
  padding: 12px 30px;
  font-size: 18px;
  margin: 15px;
  cursor: pointer;
  border-radius: 30px;
  border: none;
  transition: 0.3s;
}

#yesBtn {
  background: white;
  color: #ff3366;
  font-weight: 500;
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background: rgba(0,0,0,0.4);
  color: white;
}

#message {
  font-family: 'Great Vibes', cursive;
  font-size: 75px;
  margin-top: 50px;
  display: none;
  animation: explode 1.3s ease-out forwards;
  text-shadow: 0 0 25px white;
}

@keyframes explode {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.4); opacity: 1; }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="glow-name">SHIU</div>
<canvas id="fireworks"></canvas>

<div class="container">
<h1>Happy 9th Valentine Shiu 🌹</h1>

<h2 id="dayCounter"></h2>

<h2>Will you always be my forever Valentine? 💘</h2>

<button id="yesBtn" onclick="yesClicked()">Always Yes 😌</button>
<button id="noBtn" onclick="handleNo()">No 😏</button>

<div id="message">I Love You Shiu ❤️</div>
</div>

<script>
const startDate = new Date("January 16, 2018");
const today = new Date();
const diffDays = Math.floor((today - startDate) / (1000*60*60*24));
document.getElementById("dayCounter").innerHTML =
  "We have been together for " + diffDays + " Beautiful Days 💖";

let noClickCount = 0;
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

function handleNo() {
  noClickCount++;
  const texts = [
    "Are you sure?",
    "Think again Shiu 😌",
    "Really??",
    "Wrong choice 😏",
    "Nice try ❤️"
  ];
  noBtn.innerText = texts[noClickCount % texts.length];
  noBtn.style.transform = `scale(${1 - noClickCount*0.1})`;
}

function yesClicked() {
  document.body.classList.add("zoom");
  setTimeout(() => document.body.classList.add("shake"), 300);
  setTimeout(() => {
    document.getElementById("message").style.display = "block";
    startFireworks();
  }, 700);
}

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];

function startFireworks() {
  setInterval(() => {
    let x = Math.random() * canvas.width;
    let y = Math.random() * canvas.height / 2;
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: x,
        y: y,
        angle: Math.random() * 2 * Math.PI,
        speed: Math.random() * 4 + 2,
        radius: 2,
        color: `hsl(${Math.random()*360},100%,60%)`
      });
    }
  }, 700);
}

function animate() {
  requestAnimationFrame(animate);
  ctx.fillStyle = "rgba(255, 0, 80, 0.15)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, index) => {
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    p.radius *= 0.96;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    if (p.radius < 0.5) particles.splice(index, 1);
  });
}
animate();
</script>

</body>
</html>
